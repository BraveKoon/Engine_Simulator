name: Retitle release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.3.1
        required: true
      title:
        description: New release title
        required: true

permissions:
  contents: write

jobs:
  retitle:
    runs-on: ubuntu-latest
    steps:
      - name: Edit release title
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE"
