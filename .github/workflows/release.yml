name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 태그 (예: v1.0.0)'
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: |
          npm run standalone -- engine-simulator.html
          (cd dist && zip -qr ../engine-simulator-web-${VERSION}.zip .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            engine-simulator.html \
            "engine-simulator-web-${VERSION}.zip" \
            --title "엔진 시뮬레이터 ${VERSION}" \
            --target "$GITHUB_SHA" \
            --notes-file .github/release-notes.md
