name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: |
          npm run standalone -- engine-simulator.html
          (cd dist && zip -qr ../engine-simulator-web-${GITHUB_REF_NAME}.zip .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            engine-simulator.html \
            "engine-simulator-web-${GITHUB_REF_NAME}.zip" \
            --title "엔진 시뮬레이터 ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
