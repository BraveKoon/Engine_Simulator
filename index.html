<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c211e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>엔진 시뮬레이터</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231c211e'/%3E%3Cpath d='M14 40a18 18 0 0 1 36 0' fill='none' stroke='%23f1efea' stroke-width='4'/%3E%3Cpath d='M32 40 46 28' stroke='%23ff6b3d' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- ───────────── 엔진 선택 화면 ───────────── -->
      <section id="select" class="screen active">
        <header class="sel-head">
          <div>
            <h1>엔진 시뮬레이터</h1>
            <p>엔진을 고르고 시동을 걸어 보세요</p>
          </div>
        </header>
        <div class="preview" id="preview">
          <div class="preview-overlay">
            <div class="pv-code" id="pvCode">I4</div>
            <div class="pv-name" id="pvName"></div>
            <div class="pv-spec" id="pvSpec"></div>
          </div>
          <div class="vp-hint">끌어서 돌려 보세요</div>
        </div>
        <div class="engine-list" id="engineList" role="listbox" aria-label="엔진 목록"></div>
        <div class="sel-footer">
          <button id="goBtn" class="primary">이 엔진으로 시작하기</button>
        </div>
      </section>

      <!-- ───────────── 시뮬레이터 화면 ───────────── -->
      <section id="sim" class="screen">
        <div class="viewport" id="viewport">
          <button class="chip back" id="backBtn" aria-label="엔진 선택으로">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            엔진 선택
          </button>
          <button class="chip slow" id="slowBtn" aria-pressed="false">슬로모션</button>
          <div class="hud" id="hud"></div>
          <div class="vp-hint">끌어서 회전 · 핀치로 확대</div>
          <button class="vp-view" id="viewBtn">사선</button>
          <button class="vp-full" id="fullBtn" aria-label="전체 화면">
            <svg viewBox="0 0 24 24" width="26" height="26"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>

        <div class="panel">
          <div class="row info">
            <div class="tacho-wrap"><canvas id="tacho"></canvas></div>
            <div class="info-right">
              <div class="eng-name" id="engName"></div>
              <div class="eng-sub" id="engSub"></div>
              <div class="gear-speed">
                <div class="gear-big" id="gearBig">N</div>
                <div class="speed">
                  <span id="speedVal">0</span><small id="speedUnit">km/h</small>
                </div>
              </div>
              <div class="status"><i id="statusDot"></i><span id="statusText">꺼짐</span></div>
              <button id="powerBtn" class="power">
                <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 3v8M7.1 6.5a7.5 7.5 0 1 0 9.8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
                <span id="powerLabel">시동</span>
              </button>
            </div>
          </div>

          <div class="row controls">
            <div class="box shifter-box">
              <div class="box-head"><span>변속기</span><b id="gearName">중립</b></div>
              <div class="shifter" id="shifter"></div>
            </div>
            <div class="box pedal-well" id="brakePedal">
              <div class="box-head center"><span>브레이크</span></div>
              <div class="pedal-area">
                <div class="pedal"><i></i><i></i><i></i><i></i></div>
                <div class="pedal-value">0%</div>
              </div>
              <div class="pedal-bar"><i></i></div>
            </div>
            <div class="box pedal-well accel" id="accelPedal">
              <div class="box-head center"><span>액셀</span></div>
              <div class="pedal-area">
                <div class="pedal tall"><i></i><i></i><i></i><i></i><i></i></div>
                <div class="pedal-value">0%</div>
              </div>
              <div class="pedal-bar"><i></i></div>
            </div>
          </div>

          <button class="settings-bar" id="settingsBtn">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M4 12h2M10 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" /><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="8" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2" /></svg>
            <span>설정</span>
            <em>사운드 · 보기 · 단위</em>
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
      </section>

      <!-- ───────────── 설정 시트 ───────────── -->
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet" id="sheet" role="dialog" aria-label="설정">
        <div class="sheet-grip"></div>
        <h2>설정</h2>
        <label class="field">
          <span>엔진 소리</span>
          <input type="range" id="volume" min="0" max="1" step="0.01" />
        </label>
        <label class="field toggle">
          <span>음소거</span>
          <input type="checkbox" id="mute" />
        </label>
        <label class="field toggle">
          <span>슬로모션 (엔진 움직임을 느리게)</span>
          <input type="checkbox" id="slowToggle" />
        </label>
        <label class="field toggle">
          <span>자동 회전</span>
          <input type="checkbox" id="autoRotate" />
        </label>
        <div class="field">
          <span>속도 단위</span>
          <div class="seg" id="unitSeg">
            <button data-unit="kmh">km/h</button>
            <button data-unit="mph">mph</button>
          </div>
        </div>
        <div class="keys">
          <b>키보드</b>
          <span><kbd>↑</kbd>/<kbd>W</kbd> 액셀</span>
          <span><kbd>↓</kbd>/<kbd>S</kbd>/<kbd>Space</kbd> 브레이크</span>
          <span><kbd>1</kbd>–<kbd>6</kbd>, <kbd>R</kbd>, <kbd>N</kbd> 기어</span>
          <span><kbd>X</kbd>/<kbd>Z</kbd> 업/다운 시프트</span>
          <span><kbd>E</kbd> 시동 켜기/끄기</span>
        </div>
        <p class="note">클러치는 자동으로 작동해요. 기어를 넣고 액셀을 밟으면 반클러치로 출발합니다.</p>
        <button class="primary" id="sheetClose">닫기</button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
